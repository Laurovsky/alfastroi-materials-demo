function m29Dialog() {
  const pkg=currentPackage();
  showModal('Проект М-29','Предпросмотр расхода материалов · демонстрационная форма',`<div class="info-banner amber">${icon('info')}Не сверено со складом 1С. Для труб база сравнения — подача прораба; для комплекта — состав, проверяемый СДО.</div><div class="table-scroll" style="margin-top:18px"><table class="simple-table"><thead><tr><th>Материал</th><th>Ед.</th><th>База сравнения</th><th>Расход СДО</th><th>Δ</th></tr></thead><tbody>${m29Rows(pkg).map(r=>`<tr><td>${escapeHtml(r.name)}<small>${escapeHtml(r.workTitle)}${r.coefficient===0?' · расходник, коэф. 0':''}</small></td><td>${escapeHtml(r.unit)}</td><td>${r.norm===null?'—':n(r.norm)}</td><td>${n(r.actual)}</td><td>${r.norm===null?'—':n(r.actual-r.norm)}</td></tr>`).join('')}</tbody></table></div><p class="modal-note">Это макет отчёта, а не утверждённая учётная форма. Нормативный расход и складские основания добавляются при интеграции. Коэффициент 0 у расходника не означает нулевой норматив: до его загрузки база сравнения и отклонение не определены. Текущее состояние: ${stages[pkg.stage]}.</p>`,`<button class="button" data-action="close-modal">Закрыть</button><button class="button primary" data-action="download-m29">${icon('download')}Скачать CSV</button>`,true);
}
let pendingKs=null;
function acceptKsDialog() {
  const pkg=currentPackage(),approved=approvedForCustomer(pkg),accepted=state.customer[projectId];
  const q=Object.fromEntries($$('[data-ks]').map(el=>[el.dataset.ks,Number(el.value)]));
  const invalid=workDefs.find(w=>!finite(q[w.id])||q[w.id]>approved[w.id]-accepted[w.id]+.000001);
  if(invalid){$('#ks-error').textContent='Принятый объём должен быть от 0 до доступного остатка по каждой работе.';return;}
  if(totalCost(q)<=0){$('#ks-error').textContent='Укажите принимаемый объём хотя бы по одной работе.';return;}
  if(!['sdo','processed'].includes(pkg.stage)){toast('Сначала завершите обязательные согласования пакета.');return;}
  pendingKs=q;
  showModal('Отразить приёмку заказчиком','Будет учтён только объём, указанный в подтверждённой КС.',`<div class="modal-summary"><span>Принимается по текущей КС</span><strong>${money(totalCost(q))}</strong></div><div class="form-stack"><div class="grid-two"><label>Номер КС<input id="ks-number" value="${10+state.documents[projectId].length}" required></label><label>Дата приёмки<input id="ks-date" type="date" value="2026-09-25" required></label></div><label>Основание подтверждения<input id="ks-basis" value="Демонстрационная подписанная КС" required></label></div><p class="modal-note">В макете запись сохраняется только в браузере. Закрытый объём увеличится на принятую часть; остаток останется доступен для следующей КС.</p><div id="ks-modal-error" class="field-error" role="alert"></div>`,`<button class="button" data-action="close-modal">Отмена</button><button class="button primary" data-action="confirm-ks">Подтвердить приёмку</button>`);
}
function downloadCsv() {
  const pkg=currentPackage();const csvCell=v=>'"'+String(v).replaceAll('"','""')+'"';
  const rows=[['ПРОЕКТ М-29 — демонстрация, не сверено с 1С'],['Код работы','Работа','Материал','Ед.','Коэффициент','База сравнения','Расход СДО','Отклонение'],...m29Rows(pkg).map(r=>[r.workId,r.workTitle,r.name,r.unit,r.coefficient,r.norm??'',r.actual,r.norm===null?'':r.actual-r.norm])];
  const blob=new Blob(['\uFEFF'+rows.map(row=>row.map(csvCell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='М-29_проект_сентябрь_2026.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Демонстрационный проект М-29 выгружен в CSV');
}
document.addEventListener('click',e=>{
  const target=e.target.closest('[data-action]');if(!target||target.disabled)return;
  const action=target.dataset.action;
  if(action==='home'){save();page='objects';location.hash='objects';render();window.scrollTo(0,0);}
  else if(action==='open-project'){projectId=target.dataset.id;page='project';role='foreman';workSearch='';collapsed.clear();sdoId=null;location.hash=`project/${projectId}`;render();window.scrollTo(0,0);}
  else if(action==='role'){save();role=target.dataset.role;render();}
  else if(action==='executor'){save();executor=target.dataset.executor;render();}
  else if(action==='expand'){const id=target.dataset.id;collapsed.has(id)?collapsed.delete(id):collapsed.add(id);$('#work-rows').innerHTML=foremanRows(draft());updateNumbers();}
  else if(action==='expand-all'){collapsed.clear();$('#work-rows').innerHTML=foremanRows(draft());updateNumbers();}
  else if(action==='save')save(true);
  else if(action==='close-modal')closeModal();
  else if(action==='submit-dialog')submitDialog();
  else if(action==='add-approver'){const id=people.findIndex((_,i)=>!approvers.includes(i));if(id>=0)approvers.push(id);submitDialog(false);}
  else if(action==='remove-approver'){approvers.splice(Number(target.dataset.index),1);submitDialog(false);}
  else if(action==='submit-confirm')submitConfirm();
  else if(action==='workflow')workflowDialog(target.dataset.source);
  else if(action==='demo-approve'){
    const pkg=workflowPkg();if(pkg.stage!=='leaders')return;const person=pkg.leaders[Number(target.dataset.index)];if(person.approved)return;person.approved=true;historyEvent(pkg,`${people[person.person].split(' — ')[0]} согласовал версию ${pkg.revision}`);
    if(pkg.leaders.every(p=>p.approved)){pkg.approvedQuantities=quantities(pkg.materials,pkg.kitRules);pkg.stage=pkg.executor==='own'?'economist':'sdo';historyEvent(pkg,`Все руководители согласовали. Пакет передан ${pkg.executor==='own'?'экономисту':'в СДО'}.`);}
    syncPackage(pkg);render();workflowDialog(workflowSource);
  }
  else if(action==='demo-economist'){const pkg=workflowPkg();if(pkg.stage!=='economist')return;pkg.stage='sdo';historyEvent(pkg,'Экономист согласовал расчёт зарплаты. Пакет передан в СДО.');syncPackage(pkg);render();workflowDialog(workflowSource);}
  else if(action==='demo-return')showModal('Вернуть на доработку','Причина будет видна прорабу.',`<div class="form-stack"><label>Причина возврата<input id="return-reason" placeholder="Укажите, что нужно уточнить" required></label></div>`,`<button class="button" data-action="close-modal">Отмена</button><button class="button primary" data-action="confirm-return">Вернуть пакет</button>`);
  else if(action==='confirm-return'){const reason=$('#return-reason').value.trim();if(!reason)return toast('Укажите причину возврата.');const pkg=workflowPkg();pkg.returnReason=reason;pkg.stage='draft';pkg.revision++;pkg.leaders.forEach(p=>p.approved=false);historyEvent(pkg,'Возвращено на доработку: '+reason);state.drafts[`${pkg.projectId}:${pkg.executor}`]=pkg;syncPackage(pkg);executor=pkg.executor;role='foreman';closeModal();render();toast('Пакет возвращён прорабу');}
  else if(action==='go-sdo'){const pkg=workflowPkg();sdoId=pkg.id;role='sdo';sdoTab='materials';closeModal();render();}
  else if(action==='sdo-tab'){sdoTab=target.dataset.tab;render();}
  else if(action==='kit')kitDialog();
  else if(action==='confirm-kit'){const pkg=currentPackage();pkg.kitRules.valves=Number($('#kit-valves').value);pkg.kitChecked=true;historyEvent(pkg,`СДО проверило состав комплекта: 1 коллектор + ${pkg.kitRules.valves} крана.`);syncPackage(pkg);closeModal();render();toast('Состав комплекта подтверждён');}
  else if(action==='complete-sdo')completeSdo();
  else if(action==='reapprove'){const pkg=currentPackage();pkg.revision++;pkg.stage='leaders';pkg.leaders.forEach(p=>p.approved=false);historyEvent(pkg,'СДО изменило объём. Новая версия отправлена руководителям на повторное согласование. Основание: '+pkg.reason);syncPackage(pkg);closeModal();render();toast('Новая версия направлена всем руководителям');}
  else if(action==='m29')m29Dialog();
  else if(action==='download-m29')downloadCsv();
  else if(action==='accept-ks')acceptKsDialog();
  else if(action==='confirm-ks'){
    const number=$('#ks-number').value.trim(),date=$('#ks-date').value,basis=$('#ks-basis').value.trim();
    if(!number||!date||!basis){$('#ks-modal-error').textContent='Заполните номер, дату и основание приёмки.';return;}
    if(state.documents[projectId].some(d=>d.number===number)){ $('#ks-modal-error').textContent='КС с таким номером уже отражена. Повторное закрытие не допускается.';return;}
    if(!pendingKs)return;state.documents[projectId].push({number,date,basis,quantities:clone(pendingKs)});
    workDefs.forEach(w=>state.customer[projectId][w.id]+=pendingKs[w.id]);historyEvent(currentPackage(),`Отражена приёмка заказчиком по КС № ${number} от ${date}`);pendingKs=null;persist();closeModal();render();toast('Приёмка отражена. Непринятые объёмы остались в остатке.');
  }
  else if(action==='formula-help')showModal('Как считается объём','Пример коэффициентов для этого макета.',`<div class="definition-row"><span>Труба L = 2 м</span><strong>0,5 шт / м работы</strong></div><div class="definition-row"><span>Введено 12 труб</span><strong>12 ÷ 0,5 = 24 м</strong></div><div class="definition-row"><span>Ещё 6 труб L = 1 м</span><strong>6 ÷ 1 = 6 м</strong></div><div class="definition-row"><span>Выполнение по работе</span><strong>24 + 6 = 30 м</strong></div><p class="modal-note">Для комплектов применяется отдельное правило обеспеченности компонентами. Расходники с коэффициентом 0 не участвуют в пересчёте. Формулы здесь демонстрационные, без нормативных потерь.</p>`,`<button class="button primary" data-action="close-modal">Понятно</button>`);
  else if(action==='help')showModal('Три экрана одного процесса','Кликабельная концепция на основе интерфейса АльфаСтроя.',`<div class="history-row"><span class="avatar">1</span><div><strong>Объекты</strong><p>Откройте карточку корпуса.</p></div></div><div class="history-row"><span class="avatar">2</span><div><strong>Факт с площадки</strong><p>Измените материалы, выберите исполнителя и отправьте руководителям. В «Ходе согласования» можно имитировать их решения.</p></div></div><div class="history-row"><span class="avatar">3</span><div><strong>Обработка и закрытие СДО</strong><p>Есть заранее согласованный пакет: проверьте комплект, заполните расходники внутри их работ, просмотрите М-29 и отразите частичную приёмку заказчиком.</p></div></div><p class="modal-note">Изменения сохраняются в этом браузере. Макет не подключён к рабочей базе.</p>`,`<button class="button primary" data-action="close-modal">Начать просмотр</button>`);
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='project-search'){projectSearch=el.value;$('#project-groups').innerHTML=renderProjectGroups();}
  else if(el.id==='work-search'){workSearch=el.value;$('#work-rows').innerHTML=foremanRows(draft());updateNumbers();}
  else if(el.dataset.material){const d=draft();if(d.stage!=='draft')return;d.materials[el.dataset.material]=el.value===''?0:el.value;updateNumbers();clearTimeout(saveTimer);saveTimer=setTimeout(()=>{save();if($('#save-label'))$('#save-label').textContent='Сохранено в '+now();},500);}
  else if(el.dataset.sdoMaterial){const pkg=currentPackage();if(pkg.stage!=='sdo')return;pkg.materials[el.dataset.sdoMaterial]=el.value===''?0:el.value;if(['collector','valve'].includes(el.dataset.sdoMaterial))pkg.kitChecked=false;updateNumbers();persist();}
  else if(el.id==='sdo-reason'){currentPackage().reason=el.value;persist();}
  else if(el.dataset.ks){updateKsTotal();$('#ks-error').textContent='';}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='project-filter'){projectFilter=el.value;$('#project-groups').innerHTML=renderProjectGroups();}
  else if(el.dataset.approver!==undefined){approvers[Number(el.dataset.approver)]=Number(el.value);submitDialog(false);}
  else if(el.id==='sdo-package'){sdoId=el.value;render();}
});
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
window.addEventListener('hashchange',()=>{
  const match=location.hash.match(/^#project\/(\w+)$/);
  if(match&&projects.some(p=>p.id===match[1])){projectId=match[1];page='project';}else page='objects';render();
});
if(location.hash.startsWith('#project/')){const id=location.hash.split('/')[1];if(projects.some(p=>p.id===id)){projectId=id;page='project';}}
render();
</script>
</body>
</html>
